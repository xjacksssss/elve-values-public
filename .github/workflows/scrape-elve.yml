name: Scrape Elvebredd values

on:
  schedule:
    - cron: "0 */12 * * *"   # 00:00 and 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-elve
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8191/health && exit 0
            sleep 2
          done
          echo "FlareSolverr did not start" >&2
          exit 1

      - name: Scrape values
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
          OUTPUT_FILE: data/elve-values.json
        run: node scripts/scrape-elve.js

      - name: Commit the file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/elve-values.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Elvebredd values"
          git push
